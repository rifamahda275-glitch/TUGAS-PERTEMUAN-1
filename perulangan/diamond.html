<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond</title>
</head>
<body>

    <h2>5. Diamond</h2>
    <pre id="diamond"></pre>

    <script>
        let hasil = "";

        // Bagian atas
        for (let i = 1; i <= 5; i++) {
            for (let j = 5; j > i; j--) {
                hasil += " ";
            }

            for (let j = 1; j <= (2 * i - 1); j++) {
                hasil += "*";
            }

            hasil += "\n";
        }

        // Bagian bawah
        for (let i = 4; i >= 1; i--) {
            for (let j = 5; j > i; j--) {
                hasil += " ";
            }

            for (let j = 1; j <= (2 * i - 1); j++) {
                hasil += "*";
            }

            hasil += "\n";
        }

        document.getElementById("diamond").textContent = hasil;
    </script>

</body>
</html>
