<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piramida Terbalik</title>
</head>
<body>

    <h2>4. Piramida Terbalik</h2>
    <pre id="piramidaTerbalik"></pre>

    <script>
        let hasil = "";

        for (let i = 5; i >= 1; i--) {
            for (let j = 5; j > i; j--) {
                hasil += " ";
            }

            for (let j = 1; j <= (2 * i - 1); j++) {
                hasil += "*";
            }

            hasil += "\n";
        }

        document.getElementById("piramidaTerbalik").textContent = hasil;
    </script>

</body>
</html>
