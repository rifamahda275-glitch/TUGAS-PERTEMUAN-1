<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segitiga Naik</title>
</head>
<body>

    <h2>1. Segitiga Naik</h2>
    <pre id="segitigaNaik"></pre>

    <script>
        let hasil = "";

        for (let i = 1; i <= 5; i++) {
            for (let j = 1; j <= i; j++) {
                hasil += "*";
            }
            hasil += "\n";
        }

        document.getElementById("segitigaNaik").textContent = hasil;
    </script>

</body>
</html>
